name: Main

# workflow runs on new tag
on:
  push:
    branches: [ main ]
    tags:
      - "*"
  # allows to run workflow manually from actions tab
  workflow_dispatch:

# workflow jobs
jobs:
  test: # job - runs on every push
    runs-on: [ ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v5
      - run: date
      - run: whoami
      - run: |
          curl -LO https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz
          gunzip tree-sitter-linux-x64.gz
          chmod +x tree-sitter-linux-x64
          sudo mv tree-sitter-linux-x64 /usr/local/bin/tree-sitter
      - run: tree-sitter --version
      - run: |
         curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
         sudo tar -C /opt -xzf nvim-linux-x86_64.tar.gz
         echo "/opt/nvim-linux-x86_64/bin" >> $GITHUB_PATH
      - run: nvim --version
      - run: make install
      - run: make test
